name: Build Frontend Docker Image & Deploy

on:
  push:
    branches: [ main ] # Trigger workflow on pushes to the main branch

jobs:
  build-and-deploy-frontend: # Renamed job for clarity
    runs-on: ubuntu-latest # Use a Linux runner

    steps:
    # --- Initial Setup ---
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Use your project's Node.js version (as specified in your logs)

    # --- Client (Angular Frontend) Build ---
    - name: Install Client Project Dependencies
      run: npm install
      working-directory: ./felix-pelletier-website # Assuming your Angular app is in the 'client' subdirectory

    - name: Build Angular Web App
      run: npx ng build --configuration=production
      working-directory: ./felix-pelletier-website

    # --- Docker Setup & Build/Push Frontend ---
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }} # Should be 'felixapelletierr'
        password: ${{ secrets.FPWEB }}    # Your Docker Hub Personal Access Token

    - name: Build and push Frontend image
      uses: docker/build-push-action@v6
      with:
        context: ./felix-pelletier-website # Assumes your Angular app's Dockerfile is in the 'client' directory
        push: true
        tags: felixapelletierr/fp-developpement:latest # Your new frontend image tag

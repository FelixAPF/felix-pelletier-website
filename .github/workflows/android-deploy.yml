# .github/workflows/frontend-docker-deploy.yml (or your preferred filename)
name: Build Frontend Docker Image & Deploy

on:
  push:
    branches: [ main ] # Trigger workflow on pushes to the main branch

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
    # --- Initial Setup ---
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Use your project's Node.js version

    # --- Debug: List files at checkout root (to see the 'felix-pelletier-website' folder) ---
    - name: List files in checkout root
      run: ls -la

    - name: Install Project Dependencies
      run: npm install --legacy-peer-deps
      working-directory: ./felix-pelletier-website

    - name: Build Angular Web App
      run: npx ng build --configuration production # Or npx ng build --configuration=production
      working-directory: ./felix-pelletier-website

    - name: List output of Angular build # DEBUGGING STEP
      run: |
        echo "Listing contents of ./dist within ./felix-pelletier-website:"
        ls -R ./dist
      working-directory: ./felix-pelletier-website

    - name: Check for .dockerignore in project subdirectory # DEBUGGING STEP
      run: |
        echo "Checking for .dockerignore in ./felix-pelletier-website directory..."
        if [ -f ".dockerignore" ]; then
          echo "Found .dockerignore in ./felix-pelletier-website. Contents:"
          cat .dockerignore
        else
          echo "No .dockerignore file found in ./felix-pelletier-website directory."
        fi
      working-directory: ./felix-pelletier-website

    # --- Docker Setup & Build/Push Frontend ---
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }} # Should be 'felixapelletierr'
        password: ${{ secrets.FPWEB }}    # Your Docker Hub Personal Access Token (ensure secret name matches, e.g., FPWEB if that's what you used)

    - name: Build and push Frontend image
      uses: docker/build-push-action@v6
      with:
        context: ./felix-pelletier-website # Docker build context is the subdirectory
        file: ./felix-pelletier-website/Dockerfile # Explicitly specify Dockerfile location relative to repo root
        push: true
        tags: felixapelletierr/fp-developpement:latest # Your frontend image tag

    # --- Commented out Backend and Android Steps ---
    # ... (These remain commented out) ...

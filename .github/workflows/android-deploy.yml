name: Build Docker Images & Deploy Android

on:
  push:
    branches: [ main ] # Trigger workflow on pushes to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # Use a Linux runner

    steps:
    # --- Initial Setup ---
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Use your project's Node.js version
        
    # --- Client Build ---
    - name: Install Client Project Dependencies
      run: npm install
      working-directory: ./felix-pelletier-website

    - name: Build Angular Web App
      run: npx ng build --configuration=production
      working-directory: ./felix-pelletier-website
      
    # --- Docker Setup & Build/Push ---
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.FPWEB }} # Use the Access Token secret
        
      
    - name: Build and push Frontend image
      uses: docker/build-push-action@v6
      with:
        context: ./felix-pelletier-website # Assumes Dockerfile is in the 'client' directory
        push: true
        tags: felixapelletierr/fp-developpement:latest # Your frontend image tag

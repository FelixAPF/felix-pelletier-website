<div *ngIf="isBrowser" class="fixed inset-0 w-full h-full pointer-events-none overflow-hidden -z-10 bg-slate-base">
  <div class="absolute top-[-10%] left-[-10%] w-[30rem] h-[30rem] bg-turquoise/20 rounded-full mix-blend-screen filter blur-[120px] opacity-60 animate-blob"></div>
  
  <div class="absolute top-[10%] right-[-10%] w-[25rem] h-[25rem] bg-blue-600/20 rounded-full mix-blend-screen filter blur-[120px] opacity-60 animate-blob" style="animation-delay: 3s; animation-duration: 12s;"></div>
  
  <div class="absolute bottom-[-10%] left-[20%] w-[40rem] h-[40rem] bg-turquoise-dark/20 rounded-full mix-blend-screen filter blur-[150px] opacity-50 animate-blob" style="animation-delay: 5s; animation-duration: 15s;"></div>
  
  <div class="absolute inset-0 w-full h-full opacity-[0.03] mix-blend-overlay" 
       style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');">
  </div>
</div>

<div class="flex flex-col min-h-screen relative z-0"> 
  <app-navbar></app-navbar>

  <main class="flex-grow container mx-auto px-4 py-8 relative z-10">
    <div [@routeAnimations]="getRouteAnimationData()"
         class="min-h-[calc(100vh-var(--navbar-height,4rem)-var(--footer-height,8rem)-var(--main-padding,4rem))]">
         <router-outlet></router-outlet>
    </div>
  </main>

  <app-footer></app-footer>
</div>

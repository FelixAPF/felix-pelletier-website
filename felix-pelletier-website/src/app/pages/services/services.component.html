<div class="animate-fadeInUp pt-24 pb-20 relative z-10">
  <div class="container mx-auto px-6 mb-16 text-center">
    <div class="inline-block mb-4 px-4 py-1.5 rounded-full border border-turquoise/30 bg-turquoise/10 text-turquoise text-sm font-medium tracking-wide">
      System Capabilities
    </div>
    <h1 class="text-4xl md:text-6xl font-black mb-6 text-gradient-animated tracking-tighter" [innerHTML]="'SERVICES_PAGE.HEADER_TITLE' | translate"></h1>
    <p class="text-xl text-gray-400 max-w-2xl mx-auto" [innerHTML]="'SERVICES_PAGE.HEADER_SUBTITLE' | translate"></p>
  </div>

  <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8 container mx-auto px-6">
    <div *ngFor="let service of services; let i = index"
         class="card group flex flex-col animate-fadeInUp" [style.animation-delay]="i * 100 + 'ms'">
      
      <div class="absolute top-0 right-0 w-32 h-32 bg-turquoise/5 rounded-bl-[100px] -z-10 transition-transform duration-700 group-hover:scale-125"></div>
      
      <div class="flex-grow relative z-10">
        <div class="flex items-center mb-6">
          <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-turquoise to-blue-500 flex items-center justify-center mr-5 shadow-lg shadow-turquoise/20 group-hover:shadow-turquoise/40 transition-shadow">
            <i class="{{service.icon}} text-2xl text-slate-base font-bold"></i>
          </div>
          <h3 class="text-2xl font-bold text-white">{{ service.titleKey | translate }}</h3>
        </div>
        <p class="text-gray-400 text-base mb-6 leading-relaxed">
          {{ service.descriptionKey | translate }}
        </p>
      </div>
      
      <div class="pt-6 border-t border-white/10 mt-auto relative z-10">
        <h4 class="text-xs font-mono text-turquoise uppercase tracking-widest mb-4"><i class="pi pi-code mr-2"></i>{{ 'SERVICES_PAGE.TECH_HEADING' | translate }}</h4>
        <div class="flex flex-wrap gap-2">
          <span *ngFor="let techKey of service.technologyKeys" class="px-3 py-1.5 bg-slate-base/80 border border-white/10 rounded-md text-gray-300 text-xs font-mono shadow-inner group-hover:border-white/20 transition-colors">
            {{ techKey | translate }}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>

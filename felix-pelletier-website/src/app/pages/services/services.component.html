<div class="animate-fadeIn">
  <header class="py-16 md:py-20 bg-gradient-to-r bg-test-dark to-turquoise text-white rounded-2xl shadow-xl mb-12 md:mb-16 text-center">
    <div class="container mx-auto px-6">
      <h1 class="text-4xl md:text-5xl font-bold" [innerHTML]="'SERVICES_PAGE.HEADER_TITLE' | translate"></h1>
      <p class="mt-4 text-lg text-gray-300 max-w-2xl mx-auto" [innerHTML]="'SERVICES_PAGE.HEADER_SUBTITLE' | translate"></p>
    </div>
  </header>

  <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
    <div *ngFor="let service of services; let i = index"
         class="card flex flex-col animate-slideUp" [style.animation-delay]="i * 100 + 'ms'">
      <div class="flex-grow">
        <div class="flex items-center mb-4">
          <span class="flex items-center justify-center w-12 h-12 rounded-full bg-blue-100 text-turquoise mr-4">
            <i class="{{service.icon}} text-2xl"></i>
          </span>
          <h3 class="text-xl text-gray-800">{{ service.titleKey | translate }}</h3>
        </div>
        <p class="text-gray-600 text-sm mb-4 leading-relaxed">
          {{ service.descriptionKey | translate }}
        </p>
      </div>
      <div class="pt-4 border-t border-gray-200 mt-auto">
        <h4 class="text-xs font-semibold text-gray-500 uppercase mb-3">{{ 'SERVICES_PAGE.TECH_HEADING' | translate }}</h4>
        <div class="flex flex-wrap gap-2">
          <p-tag *ngFor="let techKey of service.technologyKeys" [value]="techKey | translate" severity="info" styleClass="bg-test-dark text-white text-xs"></p-tag>
        </div>
      </div>
    </div>
  </div>
</div>

<section class="relative min-h-screen flex items-center justify-center pt-20 overflow-hidden">
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-turquoise/20 rounded-full mix-blend-screen filter blur-[100px] animate-blob z-0"></div>
  <div class="absolute top-1/3 right-1/4 w-96 h-96 bg-blue-600/20 rounded-full mix-blend-screen filter blur-[100px] animate-blob animation-delay-200 z-0"></div>

  <div class="container mx-auto px-6 relative z-10 text-center">
    <div class="inline-block mb-6 px-4 py-1.5 rounded-full border border-turquoise/30 bg-turquoise/10 text-turquoise text-sm font-medium tracking-wide animate-fadeInDown">
      Modern Web Development
    </div>
    
    <h1 class="text-5xl sm:text-6xl md:text-8xl font-black mb-6 animate-fadeInUp leading-tight tracking-tighter">
      <span [innerHTML]="'MAIN_PAGE.HERO_TITLE' | translate"></span>
      <br/><span class="text-gradient">{{'MAIN_PAGE.ENGINEERED_TO_SCALE'|translate}}</span>
    </h1>
    
    <p class="text-lg md:text-2xl mb-12 max-w-2xl mx-auto text-gray-400 animate-fadeInUp animation-delay-200" [innerHTML]="'MAIN_PAGE.HERO_SUBTITLE' | translate"></p>
    
    <div class="flex flex-col sm:flex-row justify-center items-center space-y-4 sm:space-y-0 sm:space-x-6 animate-fadeInUp animation-delay-400">
      <button pButton type="button" [label]="'MAIN_PAGE.EXPLORE_SERVICES_BTN' | translate" icon="pi pi-arrow-right" iconPos="right"
              class="px-8 py-4 bg-turquoise text-slate-base hover:bg-turquoise-dark !rounded-full shadow-[0_0_20px_rgba(0,229,255,0.4)]" routerLink="/services"></button>
      <button pButton type="button" [label]="'MAIN_PAGE.GET_QUOTE_BTN' | translate" icon="pi pi-bolt" (click)="scrollToForm()"
              class="px-8 py-4 bg-transparent border-2 border-white/20 text-white hover:border-turquoise hover:text-turquoise !rounded-full"></button>
    </div>
  </div>
</section>

<section class="py-20 relative z-10">
  <div class="container mx-auto px-6 max-w-5xl">
    
    <div class="glass-panel rounded-2xl border border-white/10 overflow-hidden shadow-[0_20px_50px_rgba(0,229,255,0.1)] hover:shadow-[0_20px_50px_rgba(0,229,255,0.2)] transition-shadow duration-700">
      
      <div class="bg-slate-base/80 px-4 py-3 border-b border-white/10 flex items-center">
        <div class="flex space-x-2">
          <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
          <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
          <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
        </div>
        <div class="mx-auto font-mono text-xs text-gray-500 tracking-widest">~/capabilities/tech-stack</div>
      </div>

      <div class="p-8 md:p-12 bg-slate-surface/40 backdrop-blur-sm">
        
        <p class="font-mono text-turquoise mb-8 text-sm md:text-base typing-effect">
          <span class="text-pink-500">const</span> <span class="text-blue-400"> coreStack</span> = [
        </p>
        
        <div class="grid grid-cols-2 md:grid-cols-3 gap-6 pl-4 md:pl-8">
          
          <div class="flex items-center space-x-3 group animate-popIn delay-1500">
            <div class="w-10 h-10 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center group-hover:border-red-500/50 group-hover:bg-red-500/10 transition-all">
              <i class="pi pi-code text-red-400"></i>
            </div>
            <span class="font-mono text-gray-300 group-hover:text-white transition-colors">Angular</span>
          </div>

          <div class="flex items-center space-x-3 group animate-popIn delay-1700">
            <div class="w-10 h-10 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center group-hover:border-orange-500/50 group-hover:bg-orange-500/10 transition-all">
              <i class="pi pi-box text-orange-400"></i>
            </div>
            <span class="font-mono text-gray-300 group-hover:text-white transition-colors">Java</span>
          </div>

          <div class="flex items-center space-x-3 group animate-popIn delay-1900">
            <div class="w-10 h-10 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center group-hover:border-purple-500/50 group-hover:bg-purple-500/10 transition-all">
              <i class="pi pi-cog text-purple-400"></i>
            </div>
            <span class="font-mono text-gray-300 group-hover:text-white transition-colors">C#</span>
          </div>

          <div class="flex items-center space-x-3 group animate-popIn delay-2100">
            <div class="w-10 h-10 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center group-hover:border-blue-500/50 group-hover:bg-blue-500/10 transition-all">
              <i class="pi pi-sparkles text-blue-400"></i>
            </div>
            <span class="font-mono text-gray-300 group-hover:text-white transition-colors">Python</span>
          </div>

          <div class="flex items-center space-x-3 group animate-popIn delay-2300">
            <div class="w-10 h-10 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center group-hover:border-blue-400/50 group-hover:bg-blue-400/10 transition-all">
              <i class="pi pi-server text-blue-300"></i>
            </div>
            <span class="font-mono text-gray-300 group-hover:text-white transition-colors">Docker</span>
          </div>

          <div class="flex items-center space-x-3 group animate-popIn delay-2500">
            <div class="w-10 h-10 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center group-hover:border-green-500/50 group-hover:bg-green-500/10 transition-all">
              <i class="pi pi-cloud text-green-400"></i>
            </div>
            <span class="font-mono text-gray-300 group-hover:text-white transition-colors">Nginx</span>
          </div>

        </div>
        
        <div class="mt-8">
          <p class="font-mono text-turquoise text-sm md:text-base typing-effect-delayed">
            ];&nbsp;&nbsp;<span class="text-gray-500">// Always evolving.</span>
          </p>
        </div>
      </div>
    </div>

  </div>
</section>

<section class="py-24 relative z-10"> 
  <div class="container mx-auto px-6">
    <div class="text-center mb-16">
      <h2 class="text-4xl font-bold mb-4 text-white" [innerHTML]="'MAIN_PAGE.WHY_WORK_TITLE' | translate"></h2>
      <div class="w-24 h-1 bg-turquoise mx-auto rounded-full mb-6"></div>
      <p class="text-gray-400 max-w-2xl mx-auto text-lg" [innerHTML]="'MAIN_PAGE.WHY_WORK_PARAGRAPH' | translate"></p>
    </div>

    <div class="grid md:grid-cols-3 gap-8">
      <div class="card animate-fadeInUp"> 
        <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-turquoise to-blue-500 flex items-center justify-center mb-6 shadow-lg shadow-turquoise/30">
            <i class="pi pi-code text-2xl text-slate-base font-bold"></i>
        </div>
        <h3 class="text-2xl font-bold text-white mb-3" [innerHTML]="'MAIN_PAGE.TECH_TITLE' | translate"></h3>
        <p class="text-gray-400 leading-relaxed" [innerHTML]="'MAIN_PAGE.TECH_DESC' | translate"></p>
      </div>

      <div class="card animate-fadeInUp animation-delay-200">
        <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-turquoise to-blue-500 flex items-center justify-center mb-6 shadow-lg shadow-turquoise/30">
            <i class="pi pi-server text-2xl text-slate-base font-bold"></i>
        </div>
        <h3 class="text-2xl font-bold text-white mb-3" [innerHTML]="'MAIN_PAGE.CLIENT_FOCUS_TITLE' | translate"></h3>
        <p class="text-gray-400 leading-relaxed" [innerHTML]="'MAIN_PAGE.CLIENT_FOCUS_DESC' | translate"></p>
      </div>

      <div class="card animate-fadeInUp animation-delay-400">
        <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-turquoise to-blue-500 flex items-center justify-center mb-6 shadow-lg shadow-turquoise/30">
            <i class="pi pi-desktop text-2xl text-slate-base font-bold"></i>
        </div>
        <h3 class="text-2xl font-bold text-white mb-3" [innerHTML]="'MAIN_PAGE.DESIGN_TITLE' | translate"></h3>
        <p class="text-gray-400 leading-relaxed" [innerHTML]="'MAIN_PAGE.DESIGN_DESC' | translate"></p>
      </div>
    </div>
  </div>
</section>

<section id="quick-form-section" class="py-24 relative z-10 scroll-mt-32">
  <div class="container mx-auto px-4">
    <div class="glass-panel p-2 rounded-3xl max-w-3xl mx-auto border border-turquoise/20 shadow-[0_0_40px_rgba(0,229,255,0.05)]">
      <app-quick-form></app-quick-form>
    </div>
  </div>
</section>

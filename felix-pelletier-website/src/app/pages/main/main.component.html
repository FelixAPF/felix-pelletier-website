<section class="py-20 md:py-28 text-center bg-gradient-to-br bg-primary to-turquoise text-white rounded-2xl shadow-xl overflow-hidden mb-16 md:mb-24">
  <div class="container mx-auto px-6 relative z-10">
    <h1 class="text-4xl sm:text-5xl md:text-6xl font-bold mb-6 animate-fadeInDown leading-tight" [innerHTML]="'MAIN_PAGE.HERO_TITLE' | translate"></h1>
    <p class="text-lg md:text-xl mb-10 max-w-3xl mx-auto animate-fadeInUp animation-delay-300" [innerHTML]="'MAIN_PAGE.HERO_SUBTITLE' | translate"></p>
    <div class="space-y-4 sm:space-y-0 sm:space-x-4 animate-fadeInUp animation-delay-600">
      <button pButton type="button" [label]="'MAIN_PAGE.EXPLORE_SERVICES_BTN' | translate" icon="pi pi-briefcase"
              class="p-button-lg p-button-raised" routerLink="/services"></button>
      <button pButton type="button" [label]="'MAIN_PAGE.GET_QUOTE_BTN' | translate" icon="pi pi-arrow-down" (click)="scrollToForm()"
              class="p-button-lg p-button-outlined" styleClass="border-white text-white hover:bg-white/10"></button>
    </div>
  </div>
</section>

<section id="quick-form-section" class="my-16 md:my-24 scroll-mt-20">
  <div class="container mx-auto px-4">
    <app-quick-form></app-quick-form>
  </div>
</section>

<section class="py-16 md:py-20 bg-gray-100 rounded-xl"> <div class="container mx-auto px-6 text-center">
    <h2 class="text-3xl text-gray-800 mb-5" [innerHTML]="'MAIN_PAGE.WHY_WORK_TITLE' | translate"></h2>
    <p class="text-gray-600 max-w-2xl mx-auto mb-12 text-lg" [innerHTML]="'MAIN_PAGE.WHY_WORK_PARAGRAPH' | translate"></p>
    <div class="grid md:grid-cols-3 gap-8 text-left">
      <div class="card animate-slideUp"> <div class="flex items-center justify-center w-12 h-12 rounded-full bg-blue-100 text-turquoise mb-5">
            <i class="pi pi-bolt text-2xl"></i>
        </div>
        <h3 class="text-xl text-gray-700 mb-2" [innerHTML]="'MAIN_PAGE.TECH_TITLE' | translate"></h3>
        <p class="text-sm text-gray-500" [innerHTML]="'MAIN_PAGE.TECH_DESC' | translate"></p>
      </div>
      <div class="card animate-slideUp animation-delay-200">
        <div class="flex items-center justify-center w-12 h-12 rounded-full bg-blue-100 text-turquoise mb-5">
            <i class="pi pi-users text-2xl"></i>
        </div>
        <h3 class="text-xl text-gray-700 mb-2" [innerHTML]="'MAIN_PAGE.CLIENT_FOCUS_TITLE' | translate"></h3>
        <p class="text-sm text-gray-500" [innerHTML]="'MAIN_PAGE.CLIENT_FOCUS_DESC' | translate"></p>
      </div>
      <div class="card animate-slideUp animation-delay-400">
        <div class="flex items-center justify-center w-12 h-12 rounded-full bg-blue-100 text-turquoise mb-5">
            <i class="pi pi-palette text-2xl"></i>
        </div>
        <h3 class="text-xl text-gray-700 mb-2" [innerHTML]="'MAIN_PAGE.DESIGN_TITLE' | translate"></h3>
        <p class="text-sm text-gray-500" [innerHTML]="'MAIN_PAGE.DESIGN_DESC' | translate"></p>
      </div>
    </div>
  </div>
</section>

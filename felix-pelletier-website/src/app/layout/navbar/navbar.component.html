<nav
  class="sticky top-0 z-50 transition-all duration-300 ease-in-out"
  [ngClass]="isScrolled ? 'bg-gray-900 shadow-lg' : 'bg-transparent md:bg-gray-900/50 md:backdrop-blur-md'">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <div class="flex-shrink-0">
        <a routerLink="/" class="text-2xl font-mono font-bold text-primary hover:text-secondary transition-colors" (click)="closeMenu()">
          FelixPelletier<span class="text-gray-400">.dev</span>
        </a>
      </div>

      <div class="hidden md:flex md:items-center md:space-x-2">
        <a *ngFor="let item of navItems"
           [routerLink]="item.routerLink"
           routerLinkActive="bg-primary text-white"
           [routerLinkActiveOptions]="{exact: true}"
           (click)="closeMenu()"
           class="px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white transition-colors">
          <i *ngIf="item.icon" [class]="item.icon + ' mr-2'"></i>{{ item.label }}
        </a>
      </div>

      <div class="md:hidden flex items-center">
        <button (click)="toggleMenu()" type="button" class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-white hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-white" aria-controls="mobile-menu" [attr.aria-expanded]="isMenuOpen">
          <span class="sr-only">Open main menu</span>
          <svg *ngIf="!isMenuOpen" class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <svg *ngIf="isMenuOpen" class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="mobile-menu" class="md:hidden transition-all duration-300 ease-in-out overflow-hidden"
       [ngClass]="isMenuOpen ? 'max-h-screen bg-gray-800 shadow-lg' : 'max-h-0'">
    <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
      <a *ngFor="let item of navItems"
         [routerLink]="item.routerLink"
         routerLinkActive="bg-primary text-white"
         [routerLinkActiveOptions]="{exact: true}"
         (click)="closeMenu()"
         class="block px-3 py-2 rounded-md text-base font-medium text-gray-300 hover:bg-gray-700 hover:text-white transition-colors">
        <i *ngIf="item.icon" [class]="item.icon + ' mr-2'"></i>{{ item.label }}
      </a>
    </div>
  </div>
</nav>

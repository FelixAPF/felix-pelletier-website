<div class="fixed top-4 left-0 right-0 z-50 px-4 flex justify-center pointer-events-none">
  <nav class="pointer-events-auto glass-panel rounded-full px-6 py-3 flex items-center justify-between w-full max-w-5xl transition-all duration-300 border border-white/10">
    
    <a routerLink="/" class="text-2xl font-bold tracking-tighter text-white hover:text-turquoise transition-colors" (click)="closeMenu()">
      {{ 'NAV.BRAND' | translate }}<span class="text-turquoise">.</span>
    </a>

    <div class="hidden md:flex items-center space-x-2">
      <a *ngFor="let item of navItems"
         [routerLink]="item.routerLink"
         routerLinkActive="navbar-item-active" [routerLinkActiveOptions]="{exact: true}"
         (click)="closeMenu()"
         class="px-4 py-2 rounded-full text-sm font-medium text-gray-300 hover:text-white hover:bg-white/10 transition-all">
        <i *ngIf="item.icon" [class]="item.icon + ' mr-2 text-xs opacity-70'"></i>{{ item.labelKey | translate }}
      </a>
      
      <div class="ml-4 flex items-center pl-4 border-l border-white/20 space-x-1">
        <button (click)="switchLanguage('en')" type="button"
                [ngClass]="currentLang === 'en' ? 'text-turquoise bg-turquoise/10' : 'text-gray-400 hover:text-white hover:bg-white/10'"
                class="px-3 py-1.5 rounded-full text-xs font-bold transition-all">
          EN
        </button>
        <button (click)="switchLanguage('fr')" type="button"
                [ngClass]="currentLang === 'fr' ? 'text-turquoise bg-turquoise/10' : 'text-gray-400 hover:text-white hover:bg-white/10'"
                class="px-3 py-1.5 rounded-full text-xs font-bold transition-all">
          FR
        </button>
      </div>
    </div>

    <button (click)="toggleMenu()" class="md:hidden text-gray-300 hover:text-white p-2">
      <i class="pi" [ngClass]="isMenuOpen ? 'pi-times' : 'pi-bars'"></i>
    </button>
  </nav>
</div>

<div *ngIf="isMenuOpen" class="fixed inset-0 z-40 bg-slate-base/95 backdrop-blur-lg pt-24 px-6 md:hidden animate-fadeInDown">
  <div class="flex flex-col space-y-4 text-center">
    <a *ngFor="let item of navItems"
       [routerLink]="item.routerLink"
       (click)="closeMenu()"
       class="text-2xl font-semibold text-gray-300 hover:text-turquoise py-4 border-b border-white/10">
      {{ item.labelKey | translate }}
    </a>
    <div class="flex justify-center space-x-4 pt-8">
       <button (click)="switchLanguage('en'); closeMenu()" class="text-xl font-bold px-6 py-2 rounded-full cursor-pointer border border-white/20">EN</button>
       <button (click)="switchLanguage('fr'); closeMenu()" class="text-xl font-bold px-6 py-2 rounded-full cursor-pointer border border-white/20">FR</button>
    </div>
  </div>
</div>

<nav
  class="sticky top-0 z-50 transition-all duration-300 ease-in-out border-b"
  [ngClass]="isScrolled ? 'bg-white shadow-md border-gray-200' : 'bg-gray-50 border-transparent'">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <div class="flex-shrink-0">
        <a routerLink="/" class="text-2xl font-mono font-bold text-blue-600 hover:text-blue-700 transition-colors" (click)="closeMenu()">
          {{ 'NAV.BRAND' | translate }}
        </a>
      </div>

      <div class="hidden md:flex md:items-center">
        <div class="flex items-center space-x-1">
          <a *ngFor="let item of navItems"
             [routerLink]="item.routerLink"
             routerLinkActive="navbar-item-active" [routerLinkActiveOptions]="{exact: true}"
             (click)="closeMenu()"
             class="px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-200 hover:text-gray-900 transition-colors">
            <i *ngIf="item.icon" [class]="item.icon + ' mr-2'"></i>{{ item.labelKey | translate }}
          </a>
        </div>
        <div class="ml-4 flex items-center border-l border-gray-300 pl-4">
          <button (click)="switchLanguage('en')" type="button"
                  [ngClass]="currentLang === 'en' ? 'bg-blue-500 text-white font-semibold' : 'bg-transparent text-gray-600 hover:text-blue-600 hover:bg-gray-100'"
                  class="px-2 py-1 rounded-md text-xs transition-colors !min-w-[auto]">
            {{ 'LANG_SWITCH.ENGLISH' | translate }}
          </button>
          <span class="text-gray-400 mx-1">/</span>
          <button (click)="switchLanguage('fr')" type="button"
                  [ngClass]="currentLang === 'fr' ? 'bg-blue-500 text-white font-semibold' : 'bg-transparent text-gray-600 hover:text-blue-600 hover:bg-gray-100'"
                  class="px-2 py-1 rounded-md text-xs transition-colors !min-w-[auto]">
            {{ 'LANG_SWITCH.FRENCH' | translate }}
          </button>
        </div>
      </div>

      <div class="md:hidden flex items-center">
        <button (click)="toggleMenu()" type="button" class="ml-1 inline-flex items-center justify-center p-2 rounded-md text-gray-500 hover:text-gray-700 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500" aria-controls="mobile-menu" [attr.aria-expanded]="isMenuOpen">
          <span class="sr-only">{{ 'NAV.OPEN_MENU' | translate }}</span>
          <svg *ngIf="!isMenuOpen" class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <svg *ngIf="isMenuOpen" class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="mobile-menu" class="md:hidden transition-all duration-300 ease-in-out overflow-hidden"
       [ngClass]="isMenuOpen ? 'max-h-screen bg-gray-50 shadow-lg border-t border-gray-200' : 'max-h-0'">
    <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
      <a *ngFor="let item of navItems"
         [routerLink]="item.routerLink"
         routerLinkActive="navbar-item-active"
         [routerLinkActiveOptions]="{exact: true}"
         (click)="closeMenu()"
         class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:bg-gray-200 hover:text-gray-900 transition-colors">
        <i *ngIf="item.icon" [class]="item.icon + ' mr-2'"></i>{{ item.labelKey | translate }}
      </a>
      <div class="pt-2 mt-2 border-t border-gray-200">
        <div class="flex justify-around items-center px-3 py-2">
            <button (click)="switchLanguage('en')" type="button"
                    [ngClass]="currentLang === 'en' ? 'text-blue-600 font-semibold' : 'text-gray-700 hover:text-blue-600'"
                    class="p-1 rounded-md text-sm w-full text-center">
              {{ 'LANG_SWITCH.ENGLISH' | translate }}
            </button>
            <span class="text-gray-300">|</span>
            <button (click)="switchLanguage('fr')" type="button"
                    [ngClass]="currentLang === 'fr' ? 'text-blue-600 font-semibold' : 'text-gray-700 hover:text-blue-600'"
                    class="p-1 rounded-md text-sm w-full text-center">
              {{ 'LANG_SWITCH.FRENCH' | translate }}
            </button>
        </div>
      </div>
    </div>
  </div>
</nav>

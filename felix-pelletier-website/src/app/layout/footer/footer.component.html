<footer class="border-t border-white/10 mt-12 bg-slate-base relative z-10">
  <div class="container mx-auto px-6 py-12 flex flex-col md:flex-row items-center justify-between">
    <div class="mb-4 md:mb-0">
      <span class="text-2xl font-bold tracking-tighter text-white">{{ 'NAV.BRAND' | translate }}<span class="text-turquoise">.</span></span>
    </div>
    
    <p class="font-mono text-sm text-gray-500" [innerHTML]="'FOOTER.COPYRIGHT' | translate:{year: currentYear}"></p>
    
    <div class="mt-4 md:mt-0 flex space-x-6">
      <a [href]="'mailto:' + email" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-gray-400 hover:text-turquoise hover:bg-turquoise/10 transition-all border border-white/10">
        <i class="pi pi-envelope"></i>
      </a>
    </div>
  </div>
</footer>

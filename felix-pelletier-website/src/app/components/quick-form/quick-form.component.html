<div class="card max-w-2xl mx-auto"> <p-toast></p-toast>
  <form [formGroup]="quoteForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <h3 class="text-2xl font-semibold text-center text-turquoise-dark mb-8">{{ 'QUICK_FORM.TITLE' | translate }}</h3>

    <div class="field">
      <label for="nom" class="block text-sm font-medium text-gray-700 mb-1.5">{{ 'QUICK_FORM.NAME_LABEL' | translate }} <span class="text-red-500">*</span></label>
      <input id="nom" type="text" pInputText formControlName="nom" class="w-full p-inputtext-lg" [placeholder]="'QUICK_FORM.NAME_PLACEHOLDER' | translate"
             [ngClass]="{'ng-invalid ng-dirty': f['nom'].invalid && (f['nom'].dirty || f['nom'].touched)}" />
      <small *ngIf="f['nom'].invalid && (f['nom'].dirty || f['nom'].touched)" class="p-error block mt-1 text-red-500 text-xs">
        <span *ngIf="f['nom'].errors?.['required']">{{ 'QUICK_FORM.NAME_REQUIRED' | translate }}</span>
      </small>
    </div>

    <div class="field">
      <label for="telephone" class="block text-sm font-medium text-gray-700 mb-1.5">{{ 'QUICK_FORM.PHONE_LABEL' | translate }} <span class="text-red-500">*</span></label>
      <p-inputMask id="telephone" mask="(999) 999-9999" formControlName="telephone" [placeholder]="'QUICK_FORM.PHONE_PLACEHOLDER' | translate" styleClass="w-full p-inputtext-lg"
                   [ngClass]="{'ng-invalid ng-dirty': f['telephone'].invalid && (f['telephone'].dirty || f['telephone'].touched)}"></p-inputMask>
      <small *ngIf="f['telephone'].invalid && (f['telephone'].dirty || f['telephone'].touched)" class="p-error block mt-1 text-red-500 text-xs">
        </small>
    </div>

    <div class="field">
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">{{ 'QUICK_FORM.EMAIL_LABEL' | translate }} <span class="text-red-500">*</span></label>
      <input id="email" type="email" pInputText formControlName="email" class="w-full p-inputtext-lg" [placeholder]="'QUICK_FORM.EMAIL_PLACEHOLDER' | translate"
             [ngClass]="{'ng-invalid ng-dirty': f['email'].invalid && (f['email'].dirty || f['email'].touched)}" />
      <small *ngIf="f['email'].invalid && (f['email'].dirty || f['email'].touched)" class="p-error block mt-1 text-red-500 text-xs">
         </small>
    </div>

    <div class="field">
      <label for="entreprise" class="block text-sm font-medium text-gray-700 mb-1.5">{{ 'QUICK_FORM.COMPANY_LABEL' | translate }}</label>
      <input id="entreprise" type="text" pInputText formControlName="entreprise" class="w-full p-inputtext-lg" [placeholder]="'QUICK_FORM.COMPANY_PLACEHOLDER' | translate" />
    </div>

    <div class="field">
      <label for="message" class="block text-sm font-medium text-gray-700 mb-1.5">{{ 'QUICK_FORM.MESSAGE_LABEL' | translate }} <span class="text-red-500">*</span></label>
      <textarea id="message" rows="5" pTextarea formControlName="message" class="w-full p-inputtext-lg" [placeholder]="'QUICK_FORM.MESSAGE_PLACEHOLDER' | translate" [autoResize]="true"
                [ngClass]="{'ng-invalid ng-dirty': f['message'].invalid && (f['message'].dirty || f['message'].touched)}"></textarea>
      <small *ngIf="f['message'].invalid && (f['message'].dirty || f['message'].touched)" class="p-error block mt-1 text-red-500 text-xs">
        </small>
    </div>

    <div class="text-center pt-4">
      <button pButton type="submit" [label]="'QUICK_FORM.SUBMIT_BUTTON' | translate" icon="pi pi-send"
              class="p-button-lg" [loading]="isLoading" [disabled]="quoteForm.invalid || isLoading"></button>
    </div>
  </form>
</div>
